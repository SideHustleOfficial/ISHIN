<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app">
    <aside class="side">
      <div class="side-top">
        <div class="me">
          <div id="myAvatar" class="avatar"></div>
          <strong id="myName">…</strong>
        </div>
        <button id="logout" class="ghost">Log out</button>
      </div>
      <div class="search">
        <input id="chatSearch" placeholder="Search or add username" autocomplete="off">
        <button id="addFriendBtn" title="Add friend">＋</button>
      </div>
      <ul id="chatList" class="chat-list"></ul>
    </aside>

    <main class="main">
      <header class="chat-head">
        <button id="backBtn" class="ghost back">←</button>
        <div id="chatAvatar" class="avatar"></div>
        <strong id="chatName"></strong>
      </header>
      <div id="empty" class="empty">Search a username and click ＋ to start chatting</div>
      <div id="messages" class="messages"></div>
      <div id="emojiPanel" class="emoji-panel" hidden></div>
      <form id="msgForm" class="composer">
        <button type="button" id="emojiBtn" class="ghost">😊</button>
        <label class="ghost">🖼️<input id="imageInput" type="file" accept="image/*" hidden></label>
        <input id="textInput" placeholder="Message…" autocomplete="off">
        <button type="submit" class="send">Send</button>
      </form>
    </main>
  </div>
  <script type="module" src="chat.js"></script>
</body>
</html>
