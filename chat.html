<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="me">
        <strong id="myName">…</strong>
        <button id="logout" class="small">Log out</button>
      </div>
      <div class="search">
        <input id="searchInput" placeholder="Exact username">
        <button id="searchBtn" class="small">Add</button>
      </div>
      <ul id="friendsList" class="friends"></ul>
    </aside>
    <main class="chat">
      <header id="chatTitle">Pick or add a friend</header>
      <div id="messages" class="messages"></div>
      <div id="emojiPanel" class="emoji-panel" hidden></div>
      <form id="msgForm" class="composer">
        <button type="button" id="emojiBtn" class="icon">😊</button>
        <label class="icon">🖼️<input id="imageInput" type="file" accept="image/*" hidden></label>
        <input id="textInput" placeholder="Message" autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </main>
  </div>
  <script type="module" src="chat.js"></script>
</body>
</html>
